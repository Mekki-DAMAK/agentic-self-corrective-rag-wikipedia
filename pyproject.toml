[tool.poetry]
name = "self-rag-wikipedia-demo"
version = "1.0.0"
description = "Agentic and self-corrective RAG on Wikipedia with BM25, FAISS, reranking, Self-RAG judging, and RAGAS evaluation."
authors = ["Mekki Damak"]
readme = "README.md"
packages = [{ include = "self_rag_pro", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
streamlit = "^1.38.0"
pandas = "^2.2.2"
numpy = "<2"
pyyaml = "^6.0.2"
requests = "^2.32.3"
tqdm = "^4.66.5"
rank-bm25 = "^0.2.2"
faiss-cpu = "^1.8.0.post1"
sentence-transformers = "^3.0.1"
transformers = "^4.44.2"
torch = "^2.3.1"
accelerate = "^0.33.0"
scikit-learn = "^1.5.1"
ragas = "^0.1.20"
datasets = "^2.21.0"
langchain = "^0.2.14"
langchain-community = "^0.2.12"
langchain-huggingface = "^0.0.3"
openpyxl = "^3.1.5"
wandb = { version = "^0.17.8", optional = true }
pytest = { version = "^8.3.2", optional = true }
pytest-timeout = { version = "^2.3.1", optional = true }
ruff = { version = "^0.6.2", optional = true }
mypy = { version = "^1.11.2", optional = true }
types-PyYAML = { version = "^6.0.12.20240808", optional = true }
types-requests = { version = "^2.32.0.20240914", optional = true }
pandas-stubs = { version = "^2.2.2.240807", optional = true }

[tool.poetry.extras]
tracking = ["wandb"]
dev = ["pytest", "pytest-timeout", "ruff", "mypy", "types-PyYAML", "types-requests", "pandas-stubs"]
eval = ["ragas", "datasets", "langchain", "langchain-community", "langchain-huggingface"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["data", "wandb", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["self_rag_pro"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
plugins = []
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
disable_error_code = ["import-untyped"]
mypy_path = "src"
exclude = ["data", "wandb", "build", "dist"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
