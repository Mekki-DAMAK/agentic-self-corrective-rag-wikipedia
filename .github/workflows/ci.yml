name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package with development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,eval,tracking]"

      - name: Ruff lint
        run: ruff check .

      - name: MyPy type check
        run: mypy src scripts app

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t self-rag-wikipedia-demo .
